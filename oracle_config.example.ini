# Oracle configuration -- copy to bin/oracle_config.ini (next to bin/oracle-gui)
# to use. Read once at GUI startup; a missing file means all defaults.
# Only [gui] is interpreted so far; other sections are reserved for the
# general config (see ideas/7 config file/).

[gui]
# Text font for the status bar/log and card text. Absolute path, or relative
# to the project root. Falls back to the bundled fonts if unset or unreadable.
# Any bundled family works, e.g.:
#   font_path = assets/fonts/Fredoka/static/Fredoka-Regular.ttf
# or your own system Comic Sans MS (not redistributed with the game):
#   font_path = /usr/share/fonts/truetype/msttcorefonts/Comic_Sans_MS.ttf
# font_path =

# Font for the numbers and name on champion cards (default: Fredoka Medium).
# Same path rules as font_path. Other weights live in assets/fonts/Fredoka/static/.
# card_font_path = assets/fonts/Fredoka/static/Fredoka-SemiBold.ttf

# Font for the message log. A monospaced font keeps the columns aligned; the
# bundled default is assets/fonts/Yomogi/Yomogi-Regular.ttf (the only monospaced
# family in assets/fonts). System fonts work too, e.g.
#   log_font_path = /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
# log_font_path =

# Draw the fractal art (assets/fractals/) behind champion card text.
# true/false/yes/no/on/off/1/0
legacy_fractal = false
